# Automated checks for Challenge 5. Run them yourself with:
#
#     uv run gatorgrade --config gatorgrade.yml
#
# These are the same checks that run on GitHub when you push. Results are
# preliminary: the final grade is determined by the instructor.

- description: "[JOINT] The joint table has a cell for every hypothesis and report"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_joint_has_an_entry_for_every_hypothesis_and_report

- description: "[JOINT] Each cell is the prior times the likelihood"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_joint_is_the_prior_times_the_likelihood

- description: "[JOINT] The joint table sums to 1"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_joint_sums_to_one

- description: "[JOINT] The joint builds the worksheet's spam filter table"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_joint_builds_the_worksheet_table

- description: "[EVIDENCE] P(e) adds P(h) * P(e | h) over the hypotheses"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_evidence_probability_adds_over_the_hypotheses

- description: "[EVIDENCE] P(flagged) is 0.206, as on the worksheet"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_evidence_probability_matches_the_worksheet

- description: "[EVIDENCE] P(yes) and P(no) add up to 1"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_evidence_probabilities_add_up_to_one

- description: "[POSTERIOR] A flagged essay is AI-written with probability 2/3"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_posterior_turns_a_flag_around_into_the_author

- description: "[POSTERIOR] The posterior reads the report that was observed"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_posterior_reads_the_report_that_was_observed

- description: "[POSTERIOR] P(present | yes) is not P(yes | present)"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_posterior_is_not_the_likelihood

- description: "[POSTERIOR] The same report means less on the highway"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_posterior_depends_on_the_prior

- description: "[POSTERIOR] Bayes' rule works for three hypotheses"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_posterior_works_for_three_hypotheses

- description: "[POSTERIOR] Every posterior adds up to 1"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_posterior_answers_add_up_to_one

- description: "[POSTERIOR] Evidence every hypothesis agrees on leaves the prior"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_evidence_every_hypothesis_agrees_on_leaves_the_prior

- description: "[POSTERIOR] The posterior leaves the prior and the table unchanged"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_posterior_leaves_its_arguments_unchanged

- description: "[CAR] Naive Bayes, built on your posterior, combines both sensors"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_naive_bayes_combines_both_sensors

- description: "[CAR] The car's action is evidence about the pedestrian"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_vehicle.py::test_the_action_as_evidence

- description: "[STYLE] Code follows the Google Python style guide"
  check: ExecuteCommand
  options:
    command: uv run ruff check src tests

- description: "[STYLE] Type annotations check out"
  check: ExecuteCommand
  options:
    command: uv run mypy src tests

- src/vehicle.py:
  - description: "[STYLE] No unfinished TODO markers are left in vehicle.py"
    check: MatchFileFragment
    options:
      fragment: "TODO"
      count: 0
      exact: true

- docs/summary.md:
  - description: "[REFLECTION] The reflection has no TODO markers left in it"
    check: MatchFileFragment
    options:
      fragment: "TODO"
      count: 0
      exact: true
  - description: "[REFLECTION] The reflection meets the 200 word minimum"
    check: CountFileWords
    options:
      count: 200
      exact: false
