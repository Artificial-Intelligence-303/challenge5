name: Verbal Check
description: The short spoken check on a challenge, done in lab with the instructor.
title: "Challenge 5 Verbal Check"
body:
  - type: markdown
    attributes:
      value: |
        Filled in by the instructor or a technical leader during lab. The student
        answers two or three questions about their own code in the context of the
        assignment at hand. This is a check on understanding, not a presentation.

        Challenge 5 asked for three functions in `src/vehicle.py`: `joint`, the
        product rule; `evidence_probability`, the law of total probability; and
        `posterior`, Bayes' rule. Every line below is about one of those three.
        Questions for each line, with what to listen for:
        https://areweagentsyet.com/tl/verbal-checks-challenge-05/
  - type: input
    attributes:
      label: Student
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Understanding
      description: Tick each line the student explained correctly, in their own words. Two or three questions is enough; no line needs their code open or a remembered number.
      options:
        - label: "The table they built. What one cell of `joint` is, and why the cells add to 1."
        - label: "The sum they wrote. What `evidence_probability` adds up, and why each term is weighted by the prior."
        - label: "Bayes' rule. Why `posterior` divides by P(e), and why P(present | yes) is not P(yes | present)."
        - label: "Reading the answers. Why the same detection means less on the highway, why two sensors together say more than one, or why OCCUPANTS_FIRST reveals nothing."
  - type: dropdown
    attributes:
      label: Outcome
      options:
        - "Passed: explained their own work clearly"
        - "Passed with gaps: correct code, shaky explanation"
        - "Not yet: could not provide clear answers, can redo with a token use"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Notes
      description: What to follow up on, and anything worth remembering for the next challenge.
